services:
  api:
    build: .
    container_name: bitacora-api
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Data Source=/data/bitacora.db"
      BaseDeDatos__AplicarMigracionesAlIniciar: "true"
    volumes:
      - bitacora-data:/data

volumes:
  bitacora-data:
